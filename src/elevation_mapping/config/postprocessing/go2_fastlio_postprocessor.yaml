# Postprocessor pipeline for elevation_mapping (Go2 + FAST-LIO).
#
# Pipeline order:
#   1) Inpaint          fill holes in raw elevation -> elevation_inpainted
#   2) MeanInRadius     radial smoothing of inpainted -> elevation_smooth
#                       (smooth is the reference for the roughness formula;
#                       radius 0.10m covers ~2 cells at 0.08m/cell)
#   3) NormalVectors    surface normals from elevation_inpainted
#                       -> normal_vectors_x, normal_vectors_y, normal_vectors_z
#                       (radius 0.3m covers ~6 cells at 0.08m/cell)
#   4) Slope            slope angle (rad) = acos(normal_vectors_z) -> slope
#                       via MathExpressionFilter (the upstream Humble branch's
#                       grid_map_filters does NOT expose a standalone SlopeFilter)
#   5) Roughness        abs(elevation_inpainted - elevation_smooth) -> roughness
#                       via MathExpressionFilter (same reason; demos file
#                       grid_map_demos/config/filters_demo_filter_chain.yaml
#                       uses the same composition)
#
# 2026-10-07 tuning (after observing /elevation_map 0.5 Hz vs configured 2 Hz on
#   Orin NX): inpaint radius 0.5→0.3, normals radius 0.6→0.3, in concert with
#   resolution 0.05→0.08m and length 50→30m in go2_fastlio.yaml.  Net compute
#   drops ~1/7 (cell count) + ~1/3 (per-filter radius) ~= 20x in worst case,
#   targeting 2 Hz fused_map_publish_rate.
#
# Filter API caveats (any-botics/grid_map humble branch):
#   - NormalVectorsFilter / MeanInRadiusFilter radius is in METERS, not cells.
#     0.08m/cell -> 0.3m radius covers ~6 cells for normals, 0.10m covers ~2
#     cells for smoothing.
#   - MathExpressionFilter references layer names directly; the upstream
#     demos use prefix-stripped names (normal_vectors_z) -- the filter
#     expands the prefix at evaluation time.

elevation_mapping:
  ros__parameters:
    postprocessor_pipeline:
      # 2026-10-19 fix: filter key 必须是 filter1/filter2/... 编号;
      # 带后缀(filter1_inpaint)会让 ROS filters::FilterChain
      # configure() 找不到任何 filter,update() 静默 no-op,
      # /elevation_map_raw_post 不出 slope/roughness/elevation_inpainted
      # /elevation_smooth/normal_vectors_* 等 layer。
      # 见 memory/filters_filterchain_yaml_key_pattern.md
      filter1:
        name: inpaint
        type: gridMapCv/InpaintFilter
        params:
          input_layer: elevation
          output_layer: elevation_inpainted
          radius: 0.3
      filter2:
        name: mean_in_radius
        type: gridMapFilters/MeanInRadiusFilter
        params:
          input_layer: elevation_inpainted
          output_layer: elevation_smooth
          radius: 0.10
      filter3:
        name: surface_normals
        type: gridMapFilters/NormalVectorsFilter
        params:
          input_layer: elevation_inpainted
          output_layers_prefix: normal_vectors_
          radius: 0.3
          normal_vector_positive_axis: z
      filter4:
        name: slope
        type: gridMapFilters/MathExpressionFilter
        params:
          output_layer: slope
          expression: acos(normal_vectors_z)
      filter5:
        name: roughness
        type: gridMapFilters/MathExpressionFilter
        params:
          output_layer: roughness
          expression: abs(elevation_inpainted - elevation_smooth)